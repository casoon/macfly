[workspace]
resolver = "3"
members = [
    "crates/macfly-core",
    "crates/macfly-adapters",
    "crates/macfly-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
dirs = "6"
