[workspace]
resolver = "3"
members = [
    "crates/macfly-core",
    "crates/macfly-adapters",
    "crates/macfly-cli",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/casoon/macfly"
homepage = "https://casoon.github.io/macfly/"
documentation = "https://casoon.github.io/macfly/docs/"
keywords = ["macos", "automation", "applescript", "mcp", "cli"]
categories = ["command-line-utilities", "os::macos-apis"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
runemark = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
